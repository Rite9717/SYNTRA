services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: syntra
      MYSQL_USER: syntra
      MYSQL_PASSWORD: syntra
      MYSQL_ROOT_PASSWORD: syntra-root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-usyntra", "-psyntra"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - syntra-mysql:/var/lib/mysql

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.8.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw

  syntra-ai:
    build: ./ai-service
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    ports:
      - "8000:8000"

  syntra-api:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
      syntra-ai:
        condition: service_started
    environment:
      DB_URL: jdbc:mysql://mysql:3306/syntra?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USER: syntra
      DB_PASSWORD: syntra
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:9092
      AI_SERVICE_URL: http://syntra-ai:8000
      JWT_SECRET: syntra-dev-secret-key-change-before-production-32b
      CORS_ORIGINS: http://localhost,http://localhost:5173,http://localhost:80
      UPLOAD_DIR: /data/uploads
      GRAFANA_URL: http://localhost:3001
    ports:
      - "8080:8080"
    volumes:
      - syntra-uploads:/data/uploads

  web:
    build: ./front
    depends_on:
      - syntra-api
    ports:
      - "80:80"

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"

volumes:
  syntra-mysql:
  syntra-uploads:
