spring:
  application:
    name: syntra-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/syntra?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USER:syntra}
    password: ${DB_PASSWORD:syntra}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    admin:
      fail-fast: false
    consumer:
      group-id: syntra-rt-${random.uuid}
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: 1
    listener:
      missing-topics-fatal: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

jwt:
  secret: ${JWT_SECRET:syntra-dev-secret-key-change-before-production-32b}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

syntra:
  ai-url: ${AI_SERVICE_URL:http://localhost:8000}
  upload-dir: ${UPLOAD_DIR:./uploads}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost}
  grafana-url: ${GRAFANA_URL:http://localhost:3001}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: syntra-api

logging:
  level:
    com.syntra: INFO
